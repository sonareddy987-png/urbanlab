<style>

(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:16px;margin:0;letter-spacing:-.02em}.panel-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.panel-body{padding:18px}.section-title{font-size:17px;margin:0 0 5px}.muted{color:var(--muted)}.small-text{font-size:12px}.area-map{background:#edf0e8;position:relative;min-height:270px;overflow:hidden;border-radius:8px;border:1px solid #dce3d9;background-image:linear-gradient(27deg,transparent 48%,#d2dacf 49%,#d2dacf 50%,transparent 51%),linear-gradient(115deg,transparent 48%,#d2dacf 49%,#d2dacf 50%,transparent 51%),linear-gradient(0deg,transparent 92%,rgba(255,255,255,.65) 93%);background-size:170px 140px,210px 170px,100% 70px}.map-label{position:absolute;background:rgba(255,254,250,.92);border:1px solid #d5ddd5;border-radius:5px;padding:5px 8px;font-size:11px;font-weight:700}.map-road{position:absolute;height:10px;background:#fffefa;border:1px solid #d6ded5;transform:rotate(-18deg);width:120%;left:-10%;top:47%}.map-road.r2{transform:rotate(34deg);top:22%;left:-8%;height:7px}.map-pin{position:absolute;width:29px;height:29px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid white;box-shadow:0 2px 7px #52665b55}.map-pin span{transform:rotate(45deg);font-size:11px;font-weight:800;color:white}.map-pin.high{background:var(--red)}.map-pin.medium{background:var(--amber)}.map-pin.low{background:var(--teal)}.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:5px}.incident-list{display:grid}.incident-row{padding:13px 16px;border-bottom:1px solid #e8ece6;display:flex;gap:12px;align-items:flex-start}.incident-row:last-child{border-bottom:0}.priority-bar{width:3px;align-self:stretch;border-radius:3px;background:var(--teal);flex-shrink:0}.priority-bar.high,.priority-bar.critical{background:var(--red)}.priority-bar.medium{background:var(--amber)}.incident-main{min-width:0;flex:1}.incident-title{font-weight:750;font-size:13px;line-height:1.35;margin-bottom:4px}.incident-meta{color:var(--muted);font-size:11px}.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.02em;background:#edf0ed;color:#4f6267;white-space:nowrap}.badge.high,.badge.critical{background:var(--red-soft);color:var(--red)}.badge.medium{background:var(--amber-soft);color:#8d570d}.badge.low{background:var(--teal-soft);color:var(--teal)}.badge.resolved{background:var(--teal-soft);color:#145f56}.badge.verify{background:#e8edf5;color:#405a82}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:13px 16px;background:#fafaf6;border-bottom:1px solid var(--line)}.filters select{width:auto;min-width:130px;padding:7px 9px;font-size:12px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#71817f;background:#f7f8f3;padding:12px 14px;white-space:nowrap}td{padding:13px 14px;border-top:1px solid #e8ece6;vertical-align:middle}tr:hover td{background:#fcfcf8}.row-title{font-weight:750}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750}.field small{font-size:11px;color:var(--muted)}.field.full{grid-column:1/-1}.field textarea{min-height:100px;resize:vertical}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.required{color:var(--red)}.status-line{padding:12px 13px;border-radius:6px;background:var(--teal-soft);color:#155b54;font-size:13px;margin-top:14px}.error-line{padding:12px 13px;border-radius:6px;background:var(--red-soft);color:#8c302a;font-size:13px;margin-top:14px}.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.role-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}.role-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 11px;font-size:12px;font-weight:750}.role-tabs button.active{background:var(--ink);color:white;border-color:var(--ink)}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);gap:16px}.detail-block{padding:15px 0;border-bottom:1px solid var(--line)}.detail-block:last-child{border-bottom:0}.detail-block h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.detail-value{white-space:pre-wrap;overflow-wrap:anywhere}.history-item{padding:0 0 14px 18px;border-left:2px solid #dce5df;position:relative;font-size:12px;margin-left:5px}.history-item:before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--teal)}.history-item time{display:block;color:var(--muted);font-size:10px;margin-top:3px}.inbox-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.inbox-item:last-child{border-bottom:0}.inbox-item p{margin:4px 0;color:var(--muted);font-size:12px}.rain-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:18px}.rain-visual{background:#e9f0ee;border:1px solid #d5e0db;border-radius:9px;min-height:240px;padding:20px;position:relative;overflow:hidden}.rain-visual:after{content:"";position:absolute;left:-5%;right:-5%;height:70px;bottom:0;background:#d1ddd2;border-top:2px solid #a9bcae;transform:skewY(-4deg)}.rain-number{font-size:46px;letter-spacing:-.05em;font-weight:800;line-height:1}.rain-unit{font-size:13px;color:var(--muted);margin-top:5px}.rain-sky{position:absolute;right:22px;top:28px;font-size:44px;opacity:.8}.rain-level{margin-top:20px;font-size:12px;font-weight:800}.area-scenario{position:relative;z-index:1;margin-top:17px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scenario{background:#fffefa;border:1px solid #d4ded6;border-radius:6px;padding:10px}.scenario strong{display:block;font-size:12px}.scenario span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.range{width:100%;accent-color:var(--teal);margin:17px 0}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.about-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.about-item{padding:18px;border:1px solid var(--line);background:var(--surface);border-radius:9px}.about-item h2{font-size:15px;margin:0 0 7px}.about-item p,.about-item li{font-size:13px;color:var(--muted)}.about-item ul{padding-left:18px;margin-bottom:0}.footer{padding:20px 0 0;color:#7b8987;font-size:11px}.toast{position:fixed;bottom:18px;right:18px;z-index:50;background:var(--ink);color:white;padding:12px 16px;border-radius:7px;box-shadow:var(--shadow);max-width:min(360px,calc(100vw - 36px));font-size:13px}.hidden{display:none!important}.photo-preview{max-width:100%;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:6px;margin-top:8px}.mobile-bottom{display:none}.status-chip{display:inline-flex;align-items:center;gap:5px}.status-chip:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.divider{height:1px;background:var(--line);margin:15px 0}

@media(max-width:720px){.topbar{height:auto;min-height:62px;padding:10px 14px}.brand{min-width:0}.brand strong{font-size:14px}.brand small{font-size:10px}.mode-label{display:none}.role-select{max-width:118px;font-size:12px}.layout{display:block}.sidebar{display:none}.main{padding:22px 14px 90px}.page-head{display:block}.page-head>.btn{margin-top:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat .value{font-size:24px}.stat:last-child{grid-column:span 2}.panel-head{padding:14px}.panel-body{padding:14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.about-grid{grid-template-columns:1fr}.mobile-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));gap:2px}.mobile-bottom button{background:transparent;border:0;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:3px;padding:5px 7px;min-width:0}.mobile-bottom button span:first-child{font-size:17px}.mobile-bottom button.active{color:var(--teal);font-weight:800}.table-wrap table{min-width:650px}.area-map{min-height:230px}.area-scenario{grid-template-columns:1fr}.rain-visual{min-height:315px}.top-actions{gap:6px}.brand-mark{width:30px;height:30px}.brand small{max-width:155px;white-space:nowrap}.filters select{flex:1;min-width:100px}.incident-row{padding:12px}.role-tabs button{flex:1}.page-head h1{font-size:28px}}

<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark">U</div><div><strong>URBANLAB</strong><small>Rain Risk, Response &amp; Recovery</small></div></div>
  <div class="top-actions"><span class="mode-label">DEMO ROLE</span><select id="roleSwitch" class="role-select" aria-label="Demo role switcher"><option value="citizen">Citizen</option><option value="officer">Officer</option><option value="worker">Worker</option></select></div>
</header>
<div class="layout">
<aside class="sidebar">
  <p class="nav-title">WORKSPACE</p>
  <nav class="nav" id="sideNav">
    <button data-page="overview" class="active"><span class="nav-icon">▦</span>Overview</button>
    <button data-page="simulation"><span class="nav-icon">☂</span>Rainfall simulation</button>
    <button data-page="reports"><span class="nav-icon">＋</span>Citizen reports</button>
    <button data-page="tasks"><span class="nav-icon">☷</span>Field tasks</button>
    <button data-page="recovery"><span class="nav-icon">✓</span>Recovery</button>
    <button data-page="about"><span class="nav-icon">ⓘ</span>About the prototype</button>
  </nav>
  <div class="side-note"><strong>Student prototype</strong><br>Not an official emergency service. Sample data is labelled throughout.</div>
</aside>
<main class="main" id="main" tabindex="-1"></main>
</div>
<nav class="mobile-bottom" id="mobileNav" aria-label="Main navigation">
  <button data-page="overview" class="active"><span>▦</span><span>Overview</span></button>
  <button data-page="simulation"><span>☂</span><span>Rain</span></button>
  <button data-page="reports"><span>＋</span><span>Reports</span></button>
  <button data-page="tasks"><span>☷</span><span>Tasks</span></button>
  <button data-page="recovery"><span>✓</span><span>Recovery</span></button>
  <button data-page="about"><span>ⓘ</span><span>About</span></button>
</nav>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</div>
<script>
(() => {
const STORE='urbanlab-demo-v1';
const now=()=>new Date().toISOString();
const fmt=(d)=>{if(!d)return '—';try{return new Intl.DateTimeFormat('en-IN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d}};
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> 'UL-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Date.now().toString(36).slice(-4).toUpperCase();
const workers=[{id:'w1',name:'Ravi Kumar',area:'Kurnool North',available:true},{id:'w2',name:'S. Lakshmi',area:'Old Town',available:true},{id:'w3',name:'Imran Basha',area:'Nandyal Road',available:true}];
const sampleReports=[
{id:'UL-DEMO-101',title:'Water collecting near bus stop',locality:'Kurnool Bus Stand',description:'Sample report: water is collecting along the kerb after a shower. Please inspect the drain opening.',priority:'High',status:'Assigned',createdAt:new Date(Date.now()-1000*60*95).toISOString(),updatedAt:new Date(Date.now()-1000*60*32).toISOString(),sample:true,workerId:'w1',instructions:'Inspect drain inlet and clear visible debris if safe to do so.',targetAt:'',history:[{label:'Sample report created',at:new Date(Date.now()-1000*60*95).toISOString()},{label:'Priority set to High',at:new Date(Date.now()-1000*60*70).toISOString()},{label:'Assigned to Ravi Kumar',at:new Date(Date.now()-1000*60*32).toISOString()}]},
{id:'UL-DEMO-102',title:'Standing water at street corner',locality:'Old Town Market Lane',description:'Sample report: water remains near the corner by the market lane. Extent and cause need inspection.',priority:'Medium',status:'Needs inspection',createdAt:new Date(Date.now()-1000*60*48).toISOString(),updatedAt:new Date(Date.now()-1000*60*48).toISOString(),sample:true,workerId:'',instructions:'',targetAt:'',history:[{label:'Sample report created',at:new Date(Date.now()-1000*60*48).toISOString()}]},
{id:'UL-DEMO-103',title:'Drain overflow reported',locality:'Nandyal Road Junction',description:'Sample report: a drain appears to be overflowing onto the edge of the road. Details are illustrative.',priority:'Critical',status:'In progress',createdAt:new Date(Date.now()-1000*60*180).toISOString(),updatedAt:new Date(Date.now()-1000*60*18).toISOString(),sample:true,workerId:'w3',instructions:'Assess the reported location; follow local safety procedures.',targetAt:'',history:[{label:'Sample report created',at:new Date(Date.now()-1000*60*180).toISOString()},{label:'Assigned to Imran Basha',at:new Date(Date.now()-1000*60*90).toISOString()},{label:'Work marked in progress',at:new Date(Date.now()-1000*60*18).toISOString()}]}
];
function freshState(){return {reports:sampleReports.map(r=>({...r,history:r.history.map(h=>({...h}))})),inbox:[],lastReset:now()}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&Array.isArray(x.reports)&&Array.isArray(x.inbox))return x}catch{}const x=freshState();save(x);return x}
function save(x=state){try{localStorage.setItem(STORE,JSON.stringify(x));return true}catch(e){toast('Could not save data. Browser storage may be full or disabled.');return false}}
let state=load(),page='overview',role='citizen',selectedId=null,reportPhoto='',completionPhoto='',lastSubmittedId='',filterPriority='All priorities',filterStatus='All statuses',filterLocality='All localities',rain=35,toastTimer;
const main=document.getElementById('main');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3300)}
function addHistory(r,label){r.history=r.history||[];r.history.unshift({label,at:now()});r.updatedAt=now()}
function workerName(id){return workers.find(w=>w.id===id)?.name||'Unassigned'}
function isResolved(r){return r.status==='Resolved'}
function openCount(){return state.reports.filter(r=>!isResolved(r)).length}
function highCount(){return state.reports.filter(r=>['High','Critical'].includes(r.priority)&&!isResolved(r)).length}
function assignedCount(){return state.reports.filter(r=>r.workerId&&!isResolved(r)&&r.status!=='Ready for verification').length}
function verifyCount(){return state.reports.filter(r=>r.status==='Ready for verification').length}
function resolvedCount(){return state.reports.filter(isResolved).length}
function timeAgo(d){let m=Math.max(0,Math.round((Date.now()-new Date(d).getTime())/60000));if(m<1)return 'just now';if(m<60)return `${m}m ago`;let h=Math.floor(m/60);if(h<24)return `${h}h ago`;return `${Math.floor(h/24)}d ago`}
function priorityBadge(p){return `<span class="badge ${esc((p||'').toLowerCase())}">${esc(p||'Medium')}</span>`}
function statusBadge(s){let cls=s==='Resolved'?'resolved':s==='Ready for verification'?'verify':s==='In progress'?'low':s==='Needs inspection'?'medium':'';return `<span class="badge ${cls}">${esc(s)}</span>`}
function stats(){return `<div class="stats">
<div class="stat"><div class="label">Open reports</div><div class="value">${openCount()}</div><div class="foot">Not yet verified resolved</div></div>
<div class="stat"><div class="label">High-priority incidents</div><div class="value">${highCount()}</div><div class="foot">High or Critical, still open</div></div>
<div class="stat"><div class="label">Assigned tasks</div><div class="value">${assignedCount()}</div><div class="foot">Worker assigned, active</div></div>
<div class="stat"><div class="label">Awaiting verification</div><div class="value">${verifyCount()}</div><div class="foot">Officer action needed</div></div>
<div class="stat"><div class="label">Verified resolved</div><div class="value">${resolvedCount()}</div><div class="foot">Officer-confirmed closures</div></div>
</div>`}
function head(eyebrow,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function notice(text,warning=false){return `<div class="notice ${warning?'warn':''}">${text}</div>`}
function listRows(items){if(!items.length)return `<div class="empty"><strong>No incidents match</strong>Try another filter or submit a new citizen report.</div>`;return `<div class="incident-list">${items.map(r=>`<div class="incident-row"><div class="priority-bar ${(r.priority||'').toLowerCase()}"></div><div class="incident-main"><div class="incident-title">${esc(r.title)}</div><div class="incident-meta">${esc(r.locality)} · ${timeAgo(r.updatedAt)} ${r.sample?'· Demo sample':''}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">${priorityBadge(r.priority)} ${statusBadge(r.status)}</div></div><button class="btn small" data-open="${esc(r.id)}">Details</button></div>`).join('')}</div>`}
function mapHTML(items){const pos=[[24,35],[57,56],[75,28],[38,72],[66,76],[17,57],[84,52]];return `<div class="area-map" aria-label="Illustrative area view, not a navigational map"><div class="map-road"></div><div class="map-road r2"></div><span class="map-label" style="top:10%;left:9%">Kurnool</span><span class="map-label" style="top:68%;left:53%">Old Town</span><span class="map-label" style="top:16%;left:64%">Nandyal Road</span>${items.slice(0,7).map((r,i)=>{let p=pos[i];return `<button class="map-pin ${(r.priority||'Medium').toLowerCase()}" style="left:${p[0]}%;top:${p[1]}%" title="${esc(r.title)} — ${esc(r.locality)}" aria-label="Open ${esc(r.title)}" data-open="${esc(r.id)}"><span>${i+1}</span></button>`}).join('')}</div><div class="legend"><span><i class="dot" style="background:var(--red)"></i>High / Critical</span><span><i class="dot" style="background:var(--amber)"></i>Medium</span><span><i class="dot" style="background:var(--teal)"></i>Low</span><span>Illustrative area view · not to scale</span></div>`}
function pageOverview(){const reports=[...state.reports].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));return `${head('Operations · Kurnool, Andhra Pradesh','Rain response overview','A shared view of reports, field work and verified recovery. The area view is illustrative, not a live map.','<button class="btn primary" data-goto="reports">＋ Report waterlogging</button>')}${notice('Demo mode — data is stored in this browser. Sample reports are labelled; this is not a live municipal feed.')} ${stats()}<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Incident area view</h2><p>Approximate display positions; no real coordinates are implied.</p></div><span class="badge">Illustrative</span></div><div class="panel-body">${mapHTML(reports)}<div style="margin-top:18px"><h2 class="section-title">Latest activity</h2><p class="small-text muted" style="margin-top:0">Sorted by most recently updated</p></div></div><div class="incident-list">${reports.slice(0,4).map(r=>`<div class="incident-row"><div class="priority-bar ${(r.priority||'').toLowerCase()}"></div><div class="incident-main"><div class="incident-title">${esc(r.title)}</div><div class="incident-meta">${esc(r.locality)} · Updated ${timeAgo(r.updatedAt)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${priorityBadge(r.priority)} ${statusBadge(r.status)}</div></div><button class="btn small" data-open="${esc(r.id)}">Open</button></div>`).join('')||'<div class="empty">No reports yet.</div>'}</div></section><section class="panel"><div class="panel-head"><div><h2>Needs attention</h2><p>Items that need a decision or follow-up.</p></div></div><div class="panel-body">${state.reports.some(r=>r.status==='Needs inspection')?`<h3 class="section-title">Needs inspection</h3>${listRows(state.reports.filter(r=>r.status==='Needs inspection').slice(0,2))}`:`<div class="empty"><strong>No new inspections</strong>New citizen reports will appear here.</div>`}<div class="divider"></div><h3 class="section-title">Ready for verification</h3>${state.reports.some(r=>r.status==='Ready for verification')?listRows(state.reports.filter(r=>r.status==='Ready for verification').slice(0,2)):`<p class="small-text muted">Worker-submitted completions will appear here for officer review.</p>`}<div class="divider"></div><button class="btn" data-goto="recovery">View recovery summary →</button></div></section></div><div class="footer">Before the rain. During the rain. Until recovery. · Student prototype, not an official emergency service.</div>`}
function reportForm(){return `<section class="panel"><div class="panel-head"><div><h2>Report waterlogging</h2><p>Share enough detail for a field team to identify the location.</p></div></div><div class="panel-body"><form id="reportForm" novalidate><div class="form-grid"><div class="field"><label for="reportTitle">Short report title <span class="required">*</span></label><input id="reportTitle" name="title" required maxlength="90" placeholder="e.g. Water collecting near bus stop"></div><div class="field"><label for="locality">Locality or landmark <span class="required">*</span></label><input id="locality" name="locality" required maxlength="120" placeholder="Street, junction or nearby landmark"></div><div class="field full"><label for="description">What did you observe? <span class="required">*</span></label><textarea id="description" name="description" required maxlength="1200" placeholder="Describe the waterlogging and nearby visible landmarks. Avoid sharing personal or sensitive information."></textarea><small>10–1,200 characters. Do not enter private contact details.</small></div><div class="field full"><label for="reportPhoto">Photo evidence — take a photo or upload</label><input id="reportPhoto" name="photo" type="file" accept="image/*" capture="environment"><small>On a phone, choose Camera to take a new photo or select an existing image. Photo stays in this browser demo; keep it small.</small><div id="reportPhotoPreview"></div></div></div><div class="form-actions"><button class="btn primary" type="submit">Submit report</button><button class="btn" type="button" id="useLocation">Use my location</button><span class="small-text muted" id="locationStatus">Location is not requested until you tap the button.</span></div><div id="reportMessage" aria-live="polite"></div></form></div></section>`}
function pageReports(){const own=role==='citizen'?state.reports.filter(r=>!r.sample):state.reports;return `${head('Community reports','Citizen reports','Report a waterlogging concern, or check how a report is progressing.')} ${role==='citizen'?notice('Submitting here stores the report in this browser only. It does not send it to a municipal authority.'):notice('Officer review queue. Reports marked Demo sample are illustrative, not verified field reports.')}<div class="grid-two" style="grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr)">${reportForm()}<section class="panel"><div class="panel-head"><div><h2>${role==='citizen'?'Check a report':'Incoming reports'}</h2><p>${role==='citizen'?'Enter the ID shown after submission.':'Select a report to review its details and history.'}</p></div></div><div class="panel-body">${role==='citizen'?`<form id="lookupForm"><div class="field"><label for="lookupId">Report ID</label><input id="lookupId" placeholder="UL-XXXX-XXXX" value="${esc(lastSubmittedId)}"></div><div class="form-actions"><button class="btn" type="submit">Check status</button></div></form><div id="lookupResult" style="margin-top:14px"></div>`:`<div class="field" style="margin-bottom:12px"><label for="reportSearch">Find a report</label><input id="reportSearch" placeholder="Search title, locality or ID"></div><div id="officerReportList">${listRows(own.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)))}</div>`}</div></section></div>`}
function pageTasks(){let items=role==='worker'?state.reports.filter(r=>r.workerId==='w1'||(role==='worker'&&r.workerId)):state.reports.filter(r=>r.workerId);if(role==='worker')items=state.reports.filter(r=>r.workerId==='w1');return `${head('Field operations','Field tasks','Assignments, progress notes and completion evidence.')} ${notice(role==='worker'?'Demo worker: Ravi Kumar. This role switcher is not secure authentication.':'Assignments create an in-app task inbox entry for the selected demo worker.')}<div class="role-tabs"><button data-worker-view="w1" class="${role==='worker'?'active':''}">Ravi Kumar · Demo worker</button><button data-worker-view="w2">S. Lakshmi</button><button data-worker-view="w3">Imran Basha</button></div><div class="detail-layout"><section class="panel"><div class="panel-head"><div><h2>Assigned work</h2><p id="taskCount">Tasks assigned to selected worker</p></div></div><div id="taskList" class="incident-list">${listRows(items)}</div></section><section class="panel"><div class="panel-head"><div><h2>Task detail</h2><p>Select an assignment to update progress.</p></div></div><div class="panel-body" id="taskDetail"><div class="empty"><strong>No task selected</strong>Choose a task from the list to view instructions and update its status.</div></div></section></div>`}
function pageRecovery(){const resolved=state.reports.filter(isResolved).sort((a,b)=>new Date(b.verifiedAt||b.updatedAt)-new Date(a.verifiedAt||a.updatedAt));const total=state.reports.length;const progress=total?Math.round(resolved.length/total*100):0;return `${head('Closure and follow-through','Recovery','Track verified closures separately from work submitted by field teams.')} ${notice('Recovery progress = officer-verified resolved reports ÷ all reports in this browser demo. Sample reports are included in the total.',true)}<div class="stats"><div class="stat"><div class="label">Open incidents</div><div class="value">${openCount()}</div></div><div class="stat"><div class="label">Work in progress</div><div class="value">${state.reports.filter(r=>r.status==='In progress').length}</div></div><div class="stat"><div class="label">Awaiting verification</div><div class="value">${verifyCount()}</div></div><div class="stat"><div class="label">Verified resolved</div><div class="value">${resolvedCount()}</div></div><div class="stat"><div class="label">Verified closure share</div><div class="value">${progress}%</div><div class="foot">${resolved.length} of ${total} reports</div></div></div><section class="panel"><div class="panel-head"><div><h2>Verified closure history</h2><p>Only officer-approved closures appear here.</p></div><span class="badge resolved">${resolved.length} verified</span></div>${resolved.length?`<div class="table-wrap"><table><thead><tr><th>Incident</th><th>Locality</th><th>Worker</th><th>Verified at</th></tr></thead><tbody>${resolved.map(r=>`<tr><td><div class="row-title">${esc(r.title)}</div><div class="incident-meta">${esc(r.id)}</div></td><td>${esc(r.locality)}</td><td>${esc(workerName(r.workerId))}</td><td>${fmt(r.verifiedAt||r.updatedAt)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No verified closures yet</strong>When a worker submits completion evidence, an officer can review it and confirm closure.</div>`}</section><div style="margin-top:16px"><button class="btn" data-goto="tasks">Review field tasks →</button></div>`}
function pageSimulation(){const level=rain<25?'Light':rain<55?'Moderate':rain<80?'Heavy':'Very heavy';const risk=rain<25?'Lower illustrative concern':rain<55?'Some areas may need inspection':rain<80?'More reports may need prioritising':'High illustrative concern';const states=[['Low-lying junction','May collect water first',rain<25?'Lower':'Watch'],['Market-side drain','Drain capacity is unknown',rain<55?'Watch':'Needs inspection'],['Roadside underpass','Illustrative low point',rain<40?'Lower':'Needs inspection']];return `${head('Scenario tool','Rainfall simulation','Explore how a simple rainfall slider changes illustrative area scenarios. This is not a forecast.')} ${notice('Demonstration only. These scenarios are not flood forecasts or emergency navigation advice.',true)}<div class="rain-layout"><section class="panel"><div class="panel-head"><div><h2>Rainfall input</h2><p>Illustrative scenario input · millimetres per hour (mm/h)</p></div><span class="badge">Simulated</span></div><div class="panel-body"><label for="rainSlider" style="font-weight:750;font-size:13px">Rainfall intensity</label><input id="rainSlider" class="range" type="range" min="0" max="120" step="5" value="${rain}"><div class="range-labels"><span>0 mm/h</span><span>120 mm/h</span></div><div class="rain-visual" style="margin-top:20px"><div class="rain-sky">${rain<25?'☁':rain<60?'🌧':'⛈'}</div><div class="rain-number" id="rainNumber">${rain}</div><div class="rain-unit">mm/h · simulated input</div><div class="rain-level" id="rainLevel">${level} scenario · ${risk}</div><div class="area-scenario" id="scenarioCards">${states.map(s=>`<div class="scenario"><strong>${s[0]}</strong><span>${s[1]}</span><span class="badge ${s[2]==='Needs inspection'?'medium':s[2]==='Watch'?'medium':'low'}" style="margin-top:7px">${s[2]}</span></div>`).join('')}</div></div><details style="margin-top:18px"><summary style="font-weight:750;cursor:pointer;font-size:13px">How this simulation works</summary><p class="small-text muted">The slider is a made-up scenario input. At higher values, the interface changes the wording of three sample area cards to illustrate how teams might prioritise inspection. It does not use terrain data, drainage capacity, measured rainfall, hydrology, or validated thresholds. No scenario should be used to decide whether a road is safe.</p></details></div></section><section class="panel"><div class="panel-head"><div><h2>Scenario areas</h2><p>Illustrative examples only · not actual sensor readings.</p></div></div><div class="panel-body"><h3 class="section-title">What changes</h3><p class="small-text muted">Moving the slider updates the scenario label and suggested inspection attention. It does not create, edit or prioritise citizen reports.</p><div class="divider"></div><h3 class="section-title">What this does not do</h3><ul class="small-text muted" style="padding-left:18px"><li>Predict flooding or water depth.</li><li>Identify safe roads or recommend evacuation routes.</li><li>Read live weather, rain gauges or city sensors.</li><li>Contact an emergency service or municipal team.</li></ul><div class="divider"></div><span class="badge">Separate from real reports</span></div></section></div>`}
function pageAbout(){return `${head('Project notes','About UrbanLab','A student-built prototype exploring how rainfall reports, field response, and recovery tracking can work together.')} ${notice('Student prototype. Not an official emergency service.',true)}<div class="about-grid"><section class="about-item"><h2>What currently works</h2><ul><li>Citizen report form with validation and unique report ID.</li><li>Officer review, priority setting and worker assignment.</li><li>Worker task list, progress notes and completion submission.</li><li>Officer verification or return for additional work.</li><li>Recovery totals derived from stored reports.</li><li>In-app assignment inbox and rainfall scenario slider.</li></ul></section><section class="about-item"><h2>What is simulated</h2><ul><li>Sample incidents, worker roster and illustrative area view.</li><li>Rainfall scenarios and their inspection labels.</li><li>Demo role switcher, which is not secure authentication.</li></ul></section><section class="about-item"><h2>Data and persistence</h2><p>Demo mode — data is stored in this browser using local storage. It persists across refreshes in the same browser profile, but it does not synchronise to another device or another person's session. Reset demo data restores the original sample reports.</p></section><section class="about-item"><h2>Not connected</h2><ul><li>No municipal reporting integration or official dispatch.</li><li>No live rainfall, weather, sensor or GIS data.</li><li>No SMS, WhatsApp, email or push notifications.</li><li>No secure user accounts, shared backend or role-based server access.</li><li>Location permission is optional; manually entered landmarks also work.</li></ul></section></div><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h2>Demo data controls</h2><p>Use this before a fresh walkthrough.</p></div></div><div class="panel-body"><p class="small-text muted">Reset removes citizen-submitted demo records and restores the three labelled sample reports in this browser.</p><button class="btn danger" id="resetDemo">Reset demo data</button><div class="footer">UrbanLab · Rain Risk, Response &amp; Recovery · Before the rain. During the rain. Until recovery.</div></div></section>`}
function detailHTML(r,mode='officer'){if(!r)return `<div class="empty"><strong>Report not found</strong>It may have been reset. Return to the report list and choose another item.</div>`;const photo=r.photo?`<img class="photo-preview" src="${r.photo}" alt="Citizen report photo">`:'';const evidence=r.completionPhoto?`<img class="photo-preview" src="${r.completionPhoto}" alt="Worker completion evidence">`:'';return `<div><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div class="incident-title" style="font-size:16px">${esc(r.title)}</div><div class="incident-meta">${esc(r.id)} ${r.sample?'· Demo sample':''}</div></div>${priorityBadge(r.priority)}</div><div style="margin-top:8px">${statusBadge(r.status)}</div><div class="detail-block"><h3>Location</h3><div class="detail-value">${esc(r.locality)}</div>${r.coords?`<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(r.coords.lat)}&mlon=${encodeURIComponent(r.coords.lon)}#map=17/${encodeURIComponent(r.coords.lat)}/${encodeURIComponent(r.coords.lon)}">Open approximate location in OpenStreetMap ↗</a>`:`<p class="small-text muted">Landmark only; no coordinates supplied.</p>`}</div><div class="detail-block"><h3>Report description</h3><div class="detail-value">${esc(r.description)}</div>${photo}</div><div class="detail-block"><h3>Assignment</h3><div><strong>Worker:</strong> ${esc(workerName(r.workerId))}</div><div class="small-text muted">Assigned ${r.assignedAt?fmt(r.assignedAt):'—'}</div>${r.instructions?`<p><strong>Instructions:</strong> ${esc(r.instructions)}</p>`:''}${r.targetAt?`<p><strong>Target:</strong> ${fmt(r.targetAt)}</p>`:''}</div>${r.progressNote?`<div class="detail-block"><h3>Progress note</h3><div class="detail-value">${esc(r.progressNote)}</div></div>`:''}${r.completionNotes?`<div class="detail-block"><h3>Completion notes</h3><div class="detail-value">${esc(r.completionNotes)}</div>${evidence}</div>`:''}<div class="detail-block"><h3>Status history</h3>${(r.history||[]).map(h=>`<div class="history-item">${esc(h.label)}<time>${fmt(h.at)}</time></div>`).join('')}</div>${mode==='officer'?officerActions(r):mode==='worker'?workerActions(r):''}</div>`}
function officerActions(r){if(r.status==='Resolved')return `<div class="status-line">This incident has been verified as resolved by an officer.</div>`;return `<div class="detail-block"><h3>Officer actions</h3><form id="officerForm" data-id="${esc(r.id)}"><div class="form-grid"><div class="field"><label for="priorityEdit">Priority</label><select id="priorityEdit"><option ${r.priority==='Low'?'selected':''}>Low</option><option ${r.priority==='Medium'?'selected':''}>Medium</option><option ${r.priority==='High'?'selected':''}>High</option><option ${r.priority==='Critical'?'selected':''}>Critical</option></select></div><div class="field"><label for="workerEdit">Assign field team</label><select id="workerEdit"><option value="">Not assigned</option>${workers.map(w=>`<option value="${w.id}" ${r.workerId===w.id?'selected':''}>${esc(w.name)} · ${esc(w.area)}</option>`).join('')}</select></div><div class="field full"><label for="instructionsEdit">Assignment instructions</label><textarea id="instructionsEdit" placeholder="What should the worker inspect or do?">${esc(r.instructions||'')}</textarea></div><div class="field full"><label for="targetEdit">Optional target completion time</label><input id="targetEdit" type="datetime-local" value="${r.targetAt?new Date(new Date(r.targetAt).getTime()-new Date(r.targetAt).getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div></div><div class="form-actions"><button class="btn primary" type="submit">Save review &amp; assignment</button>${r.status==='Ready for verification'?`<button class="btn primary" type="button" id="verifyBtn" data-id="${esc(r.id)}">Verify closure</button><button class="btn" type="button" id="returnBtn" data-id="${esc(r.id)}">Return for more work</button>`:''}</div></form></div>`}
function workerActions(r){if(r.status==='Resolved')return `<div class="status-line">This task is closed. Contact the officer if a follow-up is needed.</div>`;if(!r.workerId)return `<div class="status-line">No worker has been assigned yet. An officer must assign this report first.</div>`;return `<div class="detail-block"><h3>Worker update</h3><form id="workerForm" data-id="${esc(r.id)}"><div class="field"><label for="progressNote">Progress note</label><textarea id="progressNote" placeholder="Add a short note about the work so far">${esc(r.progressNote||'')}</textarea></div><div class="form-actions"><button class="btn" type="button" id="acceptTask" data-id="${esc(r.id)}">Accept task</button><button class="btn" type="button" id="startTask" data-id="${esc(r.id)}">Mark in progress</button><button class="btn" type="submit">Save progress note</button></div><div class="divider"></div><div class="field"><label for="completionNotes">Completion notes</label><textarea id="completionNotes" placeholder="Describe what was completed and what remains">${esc(r.completionNotes||'')}</textarea></div><div class="field" style="margin-top:12px"><label for="completionPhoto">Optional completion photo</label><input type="file" id="completionPhoto" accept="image/*"><div id="completionPhotoPreview">${r.completionPhoto?'<span class="small-text muted">Completion photo already attached.</span>':''}</div></div><div class="form-actions"><button class="btn primary" type="button" id="readyBtn" data-id="${esc(r.id)}">Submit for verification</button></div><p class="small-text muted">Submitting completion does not mark the report resolved. An officer must verify it.</p></form></div>`}
function openDetail(id,kind){selectedId=id;const r=state.reports.find(x=>x.id===id);if(!r){toast('That report could not be found.');return}if(kind==='task'){const el=document.getElementById('taskDetail');if(el)el.innerHTML=detailHTML(r,role==='worker'?'worker':'officer');bindDetailForms();return}if(kind==='officer'){const el=document.getElementById('officerDetail');if(el)el.innerHTML=detailHTML(r,'officer');bindDetailForms();return}page='reports';render();const target=document.getElementById('officerReportList');if(target){target.innerHTML=listRows([r]);} }
function pageRender(){const pages={overview:pageOverview,simulation:pageSimulation,reports:pageReports,tasks:pageTasks,recovery:pageRecovery,about:pageAbout};main.innerHTML=(pages[page]||pageOverview)();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));bindCommon();if(page==='reports')bindReportForm();if(page==='tasks'){bindTaskPage();}if(page==='simulation')bindRain();if(page==='about'){document.getElementById('resetDemo')?.addEventListener('click',resetDemo)}if(page==='reports'&&role==='citizen'){document.getElementById('lookupForm')?.addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('lookupId').value.trim().toUpperCase();const r=state.reports.find(x=>x.id.toUpperCase()===id);const out=document.getElementById('lookupResult');out.innerHTML=r?`<div class="status-line"><strong>${esc(r.id)}</strong><br>${esc(r.title)}<br>${statusBadge(r.status)}<p class="small-text">Last updated ${fmt(r.updatedAt)}. This status reflects the data in this browser only.</p></div>`:`<div class="error-line">No report with that ID was found in this browser. Check the ID or use the browser where the report was submitted.</div>`})}if(page==='reports'&&role!=='citizen'){document.getElementById('reportSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();const list=state.reports.filter(r=>[r.id,r.title,r.locality].some(s=>s.toLowerCase().includes(q)));document.getElementById('officerReportList').innerHTML=listRows(list);bindOpenButtons()})}}
function render(){
  pageRender();
}
function bindCommon(){document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.goto)));bindOpenButtons();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function bindOpenButtons(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const id=b.dataset.open;if(page==='tasks'){openDetail(id,'task')}else if(role==='officer'){page='reports';render();const panel=document.createElement('section');panel.className='panel';panel.style.marginTop='16px';panel.innerHTML=`<div class="panel-head"><div><h2>Report review</h2><p>Review details, set priority and assign a worker.</p></div><button class="btn small" id="closeDetail">Close</button></div><div class="panel-body" id="officerDetail"></div>`;main.appendChild(panel);document.getElementById('closeDetail').onclick=()=>panel.remove();openDetail(id,'officer')}else{openDetail(id,'citizen')}})}
function go(p){page=p;render();main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('roleSwitch').addEventListener('change',e=>{role=e.target.value;toast(`Demo role switched to ${role}. This is not secure authentication.`);render()});
function bindReportForm(){const form=document.getElementById('reportForm');const file=document.getElementById('reportPhoto');file?.addEventListener('change',()=>readPhoto(file,photo=>{reportPhoto=photo;document.getElementById('reportPhotoPreview').innerHTML=photo?`<img class="photo-preview" src="${photo}" alt="Selected report photo preview">`:''}));document.getElementById('useLocation')?.addEventListener('click',()=>{const s=document.getElementById('locationStatus');if(!navigator.geolocation){s.textContent='This browser does not support location. Enter a landmark manually.';return}s.textContent='Waiting for your permission…';navigator.geolocation.getCurrentPosition(pos=>{const coords={lat:Number(pos.coords.latitude.toFixed(6)),lon:Number(pos.coords.longitude.toFixed(6))};form.dataset.coords=JSON.stringify(coords);s.textContent=`Location captured (${coords.lat}, ${coords.lon}). You can still enter a landmark above.`;},err=>{form.dataset.coords='';s.textContent=err.code===1?'Location permission denied. Enter a landmark manually.':'Could not get location. Enter a landmark manually.'},{enableHighAccuracy:false,timeout:10000,maximumAge:60000})});form?.addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('reportTitle').value.trim(),locality=document.getElementById('locality').value.trim(),description=document.getElementById('description').value.trim(),msg=document.getElementById('reportMessage');if(title.length<4||!locality||description.length<10){msg.innerHTML='<div class="error-line">Add a clear title (at least 4 characters), a locality or landmark, and a description of at least 10 characters.</div>';return}const r={id:uid(),title,locality,description,priority:'Medium',status:'Needs inspection',createdAt:now(),updatedAt:now(),sample:false,workerId:'',instructions:'',targetAt:'',history:[],photo:reportPhoto||'',coords:form.dataset.coords?JSON.parse(form.dataset.coords):null};addHistory(r,'Citizen report submitted in browser demo');state.reports.unshift(r);if(!save())return;lastSubmittedId=r.id;msg.innerHTML=`<div class="status-line"><strong>Report saved in this browser.</strong><br>Your report ID: <strong>${esc(r.id)}</strong><br>Current status: Needs inspection. This has not been sent to a municipal authority.</div>`;form.reset();reportPhoto='';document.getElementById('reportPhotoPreview').innerHTML='';document.getElementById('locationStatus').textContent='Location is not requested until you tap the button.';toast('Report submitted and saved in this browser.');render();if(role==='citizen'){document.getElementById('lookupId').value=r.id;const out=document.getElementById('lookupResult');if(out)out.innerHTML=`<div class="status-line">Report <strong>${esc(r.id)}</strong> · Needs inspection</div>`}})}
function readPhoto(input,cb){const f=input.files?.[0];if(!f){cb('');return}if(!f.type.startsWith('image/')){toast('Choose an image file.');input.value='';cb('');return}if(f.size>900*1024){toast('Image is larger than 900 KB. Choose a smaller image so it can be stored in this browser.');input.value='';cb('');return}const reader=new FileReader();reader.onload=()=>cb(String(reader.result));reader.onerror=()=>toast('Could not read this image. Try another file.');reader.readAsDataURL(f)}
let activeWorkerId='w1';
function bindTaskPage(){document.querySelectorAll('[data-worker-view]').forEach(b=>b.onclick=()=>{activeWorkerId=b.dataset.workerView;document.querySelectorAll('[data-worker-view]').forEach(x=>x.classList.toggle('active',x.dataset.workerView===activeWorkerId));const list=state.reports.filter(r=>r.workerId===activeWorkerId);document.getElementById('taskList').innerHTML=listRows(list);document.getElementById('taskCount').textContent=`${list.length} task(s) assigned to ${workerName(activeWorkerId)}`;document.getElementById('taskDetail').innerHTML='<div class="empty"><strong>No task selected</strong>Choose a task to view instructions and update its status.</div>';bindOpenButtons()});if(role==='worker')activeWorkerId='w1';const items=state.reports.filter(r=>r.workerId===activeWorkerId);document.getElementById('taskList').innerHTML=listRows(items);document.getElementById('taskCount').textContent=`${items.length} task(s) assigned to ${workerName(activeWorkerId)}`;bindOpenButtons();const first=items.find(r=>r.id===selectedId)||items[0];if(first)openDetail(first.id,'task');else document.getElementById('taskDetail').innerHTML='<div class="empty"><strong>No assigned tasks</strong>An officer can assign a report to this worker from the report review panel.</div>'}
function bindDetailForms(){document.getElementById('officerForm')?.addEventListener('submit',e=>{e.preventDefault();const id=e.currentTarget.dataset.id,r=state.reports.find(x=>x.id===id);if(!r)return;const oldWorker=r.workerId,newWorker=document.getElementById('workerEdit').value,priority=document.getElementById('priorityEdit').value,inst=document.getElementById('instructionsEdit').value.trim(),target=document.getElementById('targetEdit').value;r.priority=priority;r.instructions=inst;r.targetAt=target?new Date(target).toISOString():'';if(newWorker!==oldWorker){r.workerId=newWorker;r.assignedAt=newWorker?now():'';if(newWorker){r.status='Assigned';addHistory(r,`Assigned to ${workerName(newWorker)}`);state.inbox.unshift({id:uid(),workerId:newWorker,reportId:r.id,message:`New task assigned: ${r.title}`,at:now(),read:false})}else{if(r.status!=='Ready for verification')r.status='Needs inspection';addHistory(r,'Worker assignment removed')}}addHistory(r,`Officer review saved · priority ${priority}`);save();toast('Review and assignment saved.');render();if(page==='reports'){const panel=document.querySelector('#officerDetail')?.closest('.panel');if(panel){document.getElementById('officerDetail').innerHTML=detailHTML(r,'officer');bindDetailForms()}}});document.getElementById('verifyBtn')?.addEventListener('click',()=>{const r=state.reports.find(x=>x.id===document.getElementById('verifyBtn').dataset.id);if(!r)return;if(r.status!=='Ready for verification'){toast('Only submitted work can be verified.');return}r.status='Resolved';r.verifiedAt=now();addHistory(r,'Officer verified closure');save();toast('Closure verified. Recovery totals updated.');render()});document.getElementById('returnBtn')?.addEventListener('click',()=>{const r=state.reports.find(x=>x.id===document.getElementById('returnBtn').dataset.id);if(!r)return;r.status='In progress';addHistory(r,'Officer returned task for additional work');save();toast('Task returned for additional work.');render()});document.getElementById('acceptTask')?.addEventListener('click',()=>updateWorkerStatus(document.getElementById('acceptTask').dataset.id,'Assigned','Task accepted by worker'));document.getElementById('startTask')?.addEventListener('click',()=>updateWorkerStatus(document.getElementById('startTask').dataset.id,'In progress','Work marked in progress'));document.getElementById('workerForm')?.addEventListener('submit',e=>{e.preventDefault();const r=state.reports.find(x=>x.id===e.currentTarget.dataset.id);if(!r)return;r.progressNote=document.getElementById('progressNote').value.trim();addHistory(r,'Worker progress note updated');save();toast('Progress note saved.');render();openDetail(r.id,'task')});document.getElementById('completionPhoto')?.addEventListener('change',e=>readPhoto(e.target,photo=>{completionPhoto=photo;document.getElementById('completionPhotoPreview').innerHTML=photo?`<img class="photo-preview" src="${photo}" alt="Completion photo preview">`:''}));document.getElementById('readyBtn')?.addEventListener('click',()=>{const id=document.getElementById('readyBtn').dataset.id,r=state.reports.find(x=>x.id===id);if(!r)return;const notes=document.getElementById('completionNotes').value.trim();if(notes.length<8){toast('Add completion notes (at least 8 characters) before submitting.');return}r.completionNotes=notes;r.completionPhoto=completionPhoto||r.completionPhoto||'';r.status='Ready for verification';addHistory(r,'Worker submitted completion for officer verification');save();completionPhoto='';toast('Completion submitted. Officer verification is still required.');render();openDetail(r.id,'task')})}
function updateWorkerStatus(id,status,label){const r=state.reports.find(x=>x.id===id);if(!r)return;r.status=status;addHistory(r,label);save();toast(label+'.');render();openDetail(r.id,'task')}
function bindRain(){document.getElementById('rainSlider')?.addEventListener('input',e=>{rain=Number(e.target.value);const level=rain<25?'Light':rain<55?'Moderate':rain<80?'Heavy':'Very heavy';const risk=rain<25?'Lower illustrative concern':rain<55?'Some areas may need inspection':rain<80?'More reports may need prioritising':'High illustrative concern';document.getElementById('rainNumber').textContent=rain;document.getElementById('rainLevel').textContent=`${level} scenario · ${risk}`;const labels=[['Low-lying junction','May collect water first',rain<25?'Lower':'Watch'],['Market-side drain','Drain capacity is unknown',rain<55?'Watch':'Needs inspection'],['Roadside underpass','Illustrative low point',rain<40?'Lower':'Needs inspection']];document.getElementById('scenarioCards').innerHTML=labels.map(s=>`<div class="scenario"><strong>${s[0]}</strong><span>${s[1]}</span><span class="badge ${s[2]==='Needs inspection'?'medium':s[2]==='Watch'?'medium':'low'}" style="margin-top:7px">${s[2]}</span></div>`).join('')})}
function resetDemo(){if(!confirm('Reset UrbanLab demo data? This removes citizen-submitted reports and restores the sample reports in this browser.'))return;state=freshState();save();selectedId=null;lastSubmittedId='';toast('Demo data reset.');go('overview')}
render();
})();
</script>
